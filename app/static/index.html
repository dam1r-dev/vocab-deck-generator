<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор колод</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e1d8; --accent:#1f6f5c; --accent-ink:#fff; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181f; --card:#1c222c; --ink:#eef1f6; --muted:#9aa4b5; --line:#2c3441; --accent:#4cc3a3; --accent-ink:#0b1713; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form, .result { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:11px 12px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:9px; }
  input:focus, select:focus, button:focus-visible, a.dl:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { margin-top:18px; width:100%; padding:12px; font:inherit; font-weight:600; color:var(--accent-ink); background:var(--accent); border:0; border-radius:9px; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:wait; }
  #status { margin:16px 0 0; min-height:1.4em; color:var(--muted); }
  #status.err { color:var(--err); }
  .result { margin-top:20px; }
  .result h2 { font-size:18px; margin:0 0 12px; }
  .downloads { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  a.dl { padding:8px 12px; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; font-size:14px; }
  a.dl.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; border-top:0; }
  td.w { font-weight:600; white-space:nowrap; }
  .hidden { display:none; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .ace-btn { flex:none; width:46px; height:64px; padding:0; margin:0; border:0; background:none; cursor:pointer;
             transform:rotate(6deg); transition:transform .25s; }
  .ace-btn:hover { transform:rotate(-3deg) translateY(-3px); }
  .ace-btn svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

  #overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:16px;
             background:rgba(5,8,12,.72); opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s; }
  #overlay.open { opacity:1; visibility:visible; }
  .stage { perspective:1400px; display:grid; justify-items:center; gap:18px; }
  .flipper { height:min(50vh,460px); aspect-ratio:5/7; position:relative; transform-style:preserve-3d;
             transform:rotateY(180deg) scale(.8); transition:transform .8s cubic-bezier(.2,.8,.2,1); }
  #overlay.open .flipper { transform:rotateY(0) scale(1); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:4.5% / 3.2%; overflow:hidden;
          box-shadow:0 24px 60px rgba(0,0,0,.55); }
  .face svg { width:100%; height:100%; display:block; }
  .face.back { transform:rotateY(180deg); }
  #eggtext { color:#fff; font-size:16px; text-align:center; max-width:min(92vw,420px); min-height:3em; }
  #eggclose { color:#fff; background:transparent; border:1px solid rgba(255,255,255,.4); border-radius:9px;
              padding:8px 16px; width:auto; margin:0; font-weight:500; }
  .suit { position:fixed; top:-30px; font-size:26px; pointer-events:none; z-index:30; animation:fall 2.2s ease-in forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); opacity:.2; } }

  /* --- Режим изучения карточек --- */
  .study-btn { margin:0 0 14px; }
  #study { position:fixed; inset:0; z-index:15; background:var(--bg); display:none; flex-direction:column; align-items:center;
           padding:16px 16px 20px; overflow:hidden; }
  #study.open { display:flex; }
  .study-top { width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  #progress { font-weight:600; }
  .bar { flex:1; height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .ghost { margin:0; width:auto; padding:8px 14px; background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:500; }
  .deck { position:relative; flex:1; width:100%; max-width:520px; display:grid; place-items:center; min-height:0; }
  .scard { position:absolute; width:min(88vw,380px); height:min(62vh,500px); touch-action:none; user-select:none; -webkit-user-select:none;
           transition:transform .28s ease, opacity .28s; will-change:transform; cursor:grab; }
  .scard.drag { transition:none; cursor:grabbing; }
  .scard.depth1 { transform:translateY(12px) scale(.955); pointer-events:none; }
  .scard.depth2 { transform:translateY(24px) scale(.91); pointer-events:none; opacity:.8; }
  .sflip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.2,1); }
  .scard.flipped .sflip { transform:rotateY(180deg); }
  .sface { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--card);
           border:1px solid var(--line); border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.18); padding:26px 22px;
           display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; overflow:auto; }
  .sface.sback { transform:rotateY(180deg); }
  .sword { font-size:clamp(28px,8vw,40px); font-weight:700; line-height:1.15; overflow-wrap:anywhere; }
  .spos { color:var(--muted); font-style:italic; }
  .strans { font-size:clamp(26px,7vw,36px); font-weight:700; color:var(--accent); overflow-wrap:anywhere; }
  .sdef { font-size:16px; }
  .sex { font-size:15px; color:var(--muted); font-style:italic; }
  .shint { position:absolute; bottom:14px; font-size:12px; color:var(--muted); }
  .speak { position:absolute; top:12px; right:12px; margin:0; width:40px; height:40px; padding:0; border-radius:50%;
           background:transparent; color:var(--ink); border:1px solid var(--line); font-size:18px; }
  .stamp { position:absolute; top:22px; padding:6px 14px; border:3px solid; border-radius:10px; font-weight:800; font-size:22px;
           letter-spacing:1px; opacity:0; pointer-events:none; z-index:2; }
  .stamp.yes { left:20px; color:#1a9a62; transform:rotate(-12deg); }
  .stamp.no { right:20px; color:#d4402f; transform:rotate(12deg); }
  .study-actions { display:flex; gap:12px; width:100%; max-width:380px; }
  .study-actions button { margin:0; }
  .btn-no { background:transparent; color:#d4402f; border:2px solid #d4402f; }
  .btn-yes { background:#1a9a62; color:#fff; }
  .study-hint { margin:10px 0 0; font-size:13px; color:var(--muted); text-align:center; max-width:380px; }
  .summary { text-align:center; display:grid; gap:10px; justify-items:center; }
  .summary h3 { margin:0; font-size:26px; }
  .summary .nums { color:var(--muted); font-size:18px; }
  .summary button { margin:0; max-width:300px; }
  @media (prefers-reduced-motion: reduce) { .scard, .sflip { transition:none; } }
  @media (prefers-reduced-motion: reduce) {
    .suit { display:none; } .ace-btn, .flipper, #overlay { transition:none; }
    .flipper { transform:none; } #overlay.open .flipper { transform:none; }
  }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } th:nth-child(3), td:nth-child(3) { display:none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Колода слов из статьи</h1>
      <p class="sub">Вставь ссылку на англоязычную статью. Получишь слова B2/C1 для Anki и Quizlet.</p>
    </div>
    <button class="ace-btn" id="ace" type="button" aria-label="Туз пик">
      <svg viewBox="0 0 70 98" aria-hidden="true">
        <rect x="1" y="1" width="68" height="96" rx="7" fill="#fff" stroke="#d6d3c9"/>
        <text x="8" y="19" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#111">A</text>
        <use href="#spade" x="7" y="23" width="12" height="12" fill="#111"/>
        <use href="#spade" x="17" y="29" width="36" height="36" fill="#111"/>
        <g transform="rotate(180 35 49)">
          <text x="8" y="19" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#111">A</text>
          <use href="#spade" x="7" y="23" width="12" height="12" fill="#111"/>
        </g>
      </svg>
    </button>
  </header>

  <section id="study" role="dialog" aria-modal="true" aria-label="Учим карточки">
    <div class="study-top">
      <span id="progress" aria-live="polite"></span>
      <div class="bar"><i id="barfill"></i></div>
      <button id="studyClose" class="ghost" type="button">Закрыть</button>
    </div>
    <div class="deck" id="deck"></div>
    <div class="study-actions" id="studyActions">
      <button class="btn-no" id="btnNo" type="button">✕ Не знаю</button>
      <button class="btn-yes" id="btnYes" type="button">✓ Знаю</button>
    </div>
    <p class="study-hint" id="studyHint">Нажми на карточку, чтобы перевернуть. Смахни вправо — знаю, влево — не знаю. Клавиши: ← → и пробел.</p>
  </section>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="spade" viewBox="0 0 100 100">
      <path d="M50 4C50 4 8 38 8 60c0 15 12 24 25 21 4-1 8-3 11-6-1 9-5 17-13 21h38c-8-4-12-12-13-21 3 3 7 5 11 6 13 3 25-6 25-21C92 38 50 4 50 4z"/>
    </symbol>
  </svg>

  <div id="overlay" role="dialog" aria-modal="true" aria-label="Туз пик" aria-hidden="true">
    <div class="stage">
      <div class="flipper">
        <div class="face front">
          <svg viewBox="0 0 250 350">
            <rect width="250" height="350" fill="#fff"/>
            <rect x="3" y="3" width="244" height="344" rx="12" fill="none" stroke="#e2dfd5" stroke-width="2"/>
            <text x="20" y="52" font-family="Georgia,serif" font-weight="700" font-size="44" fill="#111">A</text>
            <use href="#spade" x="19" y="62" width="34" height="34" fill="#111"/>
            <use href="#spade" x="55" y="100" width="140" height="140" fill="#111"/>
            <g transform="rotate(180 125 175)">
              <text x="20" y="52" font-family="Georgia,serif" font-weight="700" font-size="44" fill="#111">A</text>
              <use href="#spade" x="19" y="62" width="34" height="34" fill="#111"/>
            </g>
          </svg>
        </div>
        <div class="face back">
          <svg viewBox="0 0 250 350">
            <defs>
              <pattern id="bk" width="16" height="16" patternUnits="userSpaceOnUse">
                <path d="M0 8L8 0L16 8L8 16Z" fill="none" stroke="#fff" stroke-opacity=".35"/>
              </pattern>
            </defs>
            <rect width="250" height="350" fill="#1f6f5c"/>
            <rect x="14" y="14" width="222" height="322" rx="8" fill="url(#bk)" stroke="#fff" stroke-opacity=".6"/>
          </svg>
        </div>
      </div>
      <div id="eggtext" role="status" aria-live="polite"></div>
      <button id="eggclose" type="button">Закрыть</button>
    </div>
  </div>

  <form id="form">
    <label for="url">Ссылка</label>
    <input id="url" type="url" required placeholder="https://..." autocomplete="off">
    <div class="row">
      <div>
        <label for="count">Слов в колоде</label>
        <input id="count" type="number" min="5" max="30" value="15">
      </div>
      <div>
        <label for="key">Код доступа</label>
        <input id="key" type="password" required autocomplete="current-password">
      </div>
    </div>
    <button id="go" type="submit">Создать колоду</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <section id="result" class="result hidden">
    <h2 id="title"></h2>
    <button id="studyBtn" class="study-btn" type="button">▶ Учить карточки</button>
    <div class="downloads" id="downloads"></div>
    <table>
      <thead><tr><th>Слово</th><th>Значение</th><th>Перевод</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const keyStore = {
  get() { try { return localStorage.getItem("deckKey") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("deckKey", v); } catch {} },
};
$("key").value = keyStore.get();
if (location.protocol === "file:") {
  setStatus("Страница открыта как файл. Запусти сервер и открой http://localhost:8000", true);
}

function download(name, data, type) {
  const a = document.createElement("a");
  a.className = "dl";
  a.textContent = name;
  a.download = name;
  a.href = URL.createObjectURL(new Blob([data], { type }));
  return a;
}
function b64ToBytes(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function setStatus(text, isErr = false) {
  $("status").textContent = text;
  $("status").className = isErr ? "err" : "";
}

// ---------- Режим изучения карточек ----------
let lastCards = [];
const study = { all: [], queue: [], known: 0, unknown: [], total: 0, busy: false };
const SWIPE = 100;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function buildCard(c, depth) {
  const card = el("div", "scard" + (depth ? " depth" + depth : ""));
  const flip = el("div", "sflip");

  const front = el("div", "sface sfront");
  front.append(el("div", "sword", c.word));
  if (c.part_of_speech) front.append(el("div", "spos", c.part_of_speech));
  front.append(el("div", "shint", "нажми, чтобы перевернуть"));
  if ("speechSynthesis" in window) {
    const sp = el("button", "speak", "🔊");
    sp.type = "button";
    sp.setAttribute("aria-label", "Произнести слово");
    sp.addEventListener("pointerdown", (e) => e.stopPropagation());
    sp.addEventListener("click", (e) => {
      e.stopPropagation();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(c.word);
      u.lang = "en-US";
      speechSynthesis.speak(u);
    });
    front.append(sp);
  }

  const back = el("div", "sface sback");
  back.append(el("div", "strans", c.translation_ru), el("div", "sdef", c.definition_en), el("div", "sex", c.example));

  flip.append(front, back);
  card.append(flip);
  if (!depth) {
    card.append(el("div", "stamp yes", "ЗНАЮ"), el("div", "stamp no", "НЕ ЗНАЮ"));
  }
  return card;
}

function renderDeck() {
  const deck = $("deck");
  deck.replaceChildren();
  const left = study.queue.length;
  $("progress").textContent = study.total - left + (left ? 1 : 0) + " / " + study.total;
  $("barfill").style.width = ((study.total - left) / study.total) * 100 + "%";
  if (!left) return showSummary();
  $("studyActions").style.display = "";
  $("studyHint").style.display = "";
  // нижние карточки добавляем первыми, верхняя последней
  for (let d = Math.min(2, left - 1); d >= 0; d--) deck.append(buildCard(study.queue[d], d));
  attachDrag(deck.lastElementChild);
  study.busy = false;
}

function flipTop() {
  const top = $("deck").lastElementChild;
  if (top && top.classList.contains("scard")) top.classList.toggle("flipped");
}

function decide(known) {
  const top = $("deck").lastElementChild;
  if (study.busy || !top || !top.classList.contains("scard")) return;
  study.busy = true;
  top.classList.remove("drag");
  top.style.transform = `translate(${known ? 140 : -140}vw, 40px) rotate(${known ? 25 : -25}deg)`;
  top.style.opacity = "0";
  const card = study.queue.shift();
  if (known) study.known++; else study.unknown.push(card);
  setTimeout(renderDeck, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 260);
}

function attachDrag(card) {
  if (!card) return;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  let sx = 0, sy = 0, dx = 0, moved = false, active = false;
  card.addEventListener("pointerdown", (e) => {
    if (study.busy) return;
    active = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0;
    card.setPointerCapture(e.pointerId);
    card.classList.add("drag");
  });
  card.addEventListener("pointermove", (e) => {
    if (!active) return;
    dx = e.clientX - sx;
    const dy = e.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    card.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx / 18}deg)`;
    const k = Math.min(Math.abs(dx) / SWIPE, 1);
    yes.style.opacity = dx > 0 ? k : 0;
    no.style.opacity = dx < 0 ? k : 0;
  });
  const end = () => {
    if (!active) return;
    active = false;
    card.classList.remove("drag");
    if (moved && Math.abs(dx) > SWIPE) return decide(dx > 0);
    card.style.transform = "";
    yes.style.opacity = no.style.opacity = 0;
    if (!moved) flipTop();
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", () => {
    active = false; card.classList.remove("drag"); card.style.transform = ""; yes.style.opacity = no.style.opacity = 0;
  });
}

function showSummary() {
  $("studyActions").style.display = "none";
  $("studyHint").style.display = "none";
  const box = el("div", "summary");
  box.append(el("h3", "", study.unknown.length ? "Раунд завершён" : "Всё знаешь! 🎉"));
  box.append(el("div", "nums", "Знаю: " + study.known + " · Не знаю: " + study.unknown.length));
  if (study.unknown.length) {
    const again = el("button", "", "Повторить незнакомые (" + study.unknown.length + ")");
    again.type = "button";
    again.addEventListener("click", () => startStudy(study.unknown));
    box.append(again);
  }
  const all = el("button", "ghost", "Начать заново");
  all.type = "button";
  all.addEventListener("click", () => startStudy(study.all));
  box.append(all);
  $("deck").append(box);
  (study.unknown.length ? box.querySelector("button") : all).focus({ preventScroll: true });
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startStudy(list) {
  if (list === lastCards) study.all = lastCards;
  else if (!study.all.length) study.all = lastCards;
  study.queue = shuffle(list);
  study.known = 0; study.unknown = []; study.total = study.queue.length; study.busy = false;
  $("study").classList.add("open");
  renderDeck();
}
function closeStudy() {
  $("study").classList.remove("open");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("studyBtn").focus();
}
$("studyBtn").addEventListener("click", () => { study.all = lastCards; startStudy(lastCards); });
$("studyClose").addEventListener("click", closeStudy);
$("btnYes").addEventListener("click", () => decide(true));
$("btnNo").addEventListener("click", () => decide(false));

// Пасхалка: клик по тузу или набор "ace"
const EGGS = [
  "ace (verb) — сдать на отлично: «She aced the exam.»",
  "ace (noun) — мастер своего дела: «He's an ace at grammar.»",
  "ace up your sleeve — козырь в рукаве. Хорошая идиома для B2!",
  "play your cards right — разыграть всё умно. Удачной колоды!",
];
let eggIdx = 0;
function closeAce() {
  const o = $("overlay");
  if (!o.classList.contains("open")) return;
  o.classList.remove("open");
  o.setAttribute("aria-hidden", "true");
  $("ace").focus();
}
function ace() {
  const o = $("overlay");
  $("eggtext").textContent = EGGS[eggIdx++ % EGGS.length];
  o.classList.add("open");
  o.setAttribute("aria-hidden", "false");
  $("eggclose").focus({ preventScroll: true });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("div");
      s.className = "suit";
      s.textContent = "♠♥♦♣"[i % 4];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDelay = Math.random() * 0.5 + "s";
      s.style.color = i % 4 === 1 || i % 4 === 2 ? "#d33" : "inherit";
      document.body.append(s);
      setTimeout(() => s.remove(), 3000);
    }
  }
}
$("ace").addEventListener("click", ace);
$("eggclose").addEventListener("click", closeAce);
$("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay" || e.target.closest(".flipper")) closeAce(); });
let typed = "";
document.addEventListener("keydown", (e) => {
  if ($("overlay").classList.contains("open")) { if (e.key === "Escape") closeAce(); return; }
  if ($("study").classList.contains("open")) {
    if (e.key === "Escape") closeStudy();
    else if (e.key === "ArrowRight") decide(true);
    else if (e.key === "ArrowLeft") decide(false);
    else if ((e.key === " " || e.key === "Enter") && !e.target.closest("button")) { e.preventDefault(); flipTop(); }
    return;
  }
  if (e.key === "Escape") return;
  if (e.target.matches("input, textarea")) return;
  typed = (typed + e.key.toLowerCase()).slice(-3);
  if (typed === "ace") ace();
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  $("result").classList.add("hidden");
  setStatus("Читаю материал и подбираю слова… это займёт до минуты.");
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": $("key").value },
      body: JSON.stringify({ url: $("url").value, count: Number($("count").value) }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Ошибка запроса (" + res.status + ")");
    keyStore.set($("key").value);
    lastCards = data.cards;

    $("title").textContent = data.title + " · " + data.count + " карточек";
    const box = $("downloads");
    box.replaceChildren();
    const apkg = download("deck.apkg", b64ToBytes(data.apkg_base64), "application/octet-stream");
    apkg.classList.add("primary");
    box.append(
      apkg,
      download("anki.txt", data.anki_csv, "text/plain;charset=utf-8"),
      download("quizlet.txt", data.quizlet_txt, "text/plain;charset=utf-8"),
      download("cards.csv", data.full_csv, "text/csv;charset=utf-8"),
    );
    const tbody = $("rows");
    tbody.replaceChildren();
    for (const c of data.cards) {
      const tr = document.createElement("tr");
      for (const [text, cls] of [[c.word, "w"], [c.definition_en, ""], [c.translation_ru, ""]]) {
        const td = document.createElement("td");
        td.textContent = text;
        if (cls) td.className = cls;
        tr.append(td);
      }
      tbody.append(tr);
    }
    $("result").classList.remove("hidden");
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("go").disabled = false;
  }
});
</script>
