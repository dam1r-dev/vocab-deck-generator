<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор колод</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e1d8; --accent:#1f6f5c; --accent-ink:#fff; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181f; --card:#1c222c; --ink:#eef1f6; --muted:#9aa4b5; --line:#2c3441; --accent:#4cc3a3; --accent-ink:#0b1713; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form, .result { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:11px 12px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:9px; }
  input:focus, select:focus, button:focus-visible, a.dl:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { margin-top:18px; width:100%; padding:12px; font:inherit; font-weight:600; color:var(--accent-ink); background:var(--accent); border:0; border-radius:9px; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:wait; }
  #status { margin:16px 0 0; min-height:1.4em; color:var(--muted); }
  #status.err { color:var(--err); }
  .result { margin-top:20px; }
  .result h2 { font-size:18px; margin:0 0 12px; }
  .downloads { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  a.dl { padding:8px 12px; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; font-size:14px; }
  a.dl.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; border-top:0; }
  td.w { font-weight:600; white-space:nowrap; }
  .hidden { display:none; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .ace-btn { flex:none; width:46px; height:64px; padding:0; margin:0; border:0; background:none; cursor:pointer;
             transform:rotate(6deg); transition:transform .25s; }
  .ace-btn:hover { transform:rotate(-3deg) translateY(-3px); }
  .ace-btn svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

  #overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:16px;
             background:rgba(5,8,12,.72); opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s; }
  #overlay.open { opacity:1; visibility:visible; }
  .stage { perspective:1400px; display:grid; justify-items:center; gap:18px; }
  .flipper { height:min(50vh,460px); aspect-ratio:5/7; position:relative; transform-style:preserve-3d;
             transform:rotateY(180deg) scale(.8); transition:transform .8s cubic-bezier(.2,.8,.2,1); }
  #overlay.open .flipper { transform:rotateY(0) scale(1); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:4.5% / 3.2%; overflow:hidden;
          box-shadow:0 24px 60px rgba(0,0,0,.55); }
  .face svg { width:100%; height:100%; display:block; }
  .face.back { transform:rotateY(180deg); }
  #eggtext { color:#fff; font-size:16px; text-align:center; max-width:min(92vw,420px); min-height:3em; }
  #eggclose { color:#fff; background:transparent; border:1px solid rgba(255,255,255,.4); border-radius:9px;
              padding:8px 16px; width:auto; margin:0; font-weight:500; }
  .suit { position:fixed; top:-30px; font-size:26px; pointer-events:none; z-index:30; animation:fall 2.2s ease-in forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    .suit { display:none; } .ace-btn, .flipper, #overlay { transition:none; }
    .flipper { transform:none; } #overlay.open .flipper { transform:none; }
  }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } th:nth-child(3), td:nth-child(3) { display:none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Колода слов из статьи</h1>
      <p class="sub">Вставь ссылку на англоязычную статью. Получишь слова B2/C1 для Anki и Quizlet.</p>
    </div>
    <button class="ace-btn" id="ace" type="button" aria-label="Туз пик">
      <svg viewBox="0 0 70 98" aria-hidden="true">
        <rect x="1" y="1" width="68" height="96" rx="7" fill="#fff" stroke="#d6d3c9"/>
        <text x="8" y="19" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#111">A</text>
        <use href="#spade" x="7" y="23" width="12" height="12" fill="#111"/>
        <use href="#spade" x="17" y="29" width="36" height="36" fill="#111"/>
        <g transform="rotate(180 35 49)">
          <text x="8" y="19" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#111">A</text>
          <use href="#spade" x="7" y="23" width="12" height="12" fill="#111"/>
        </g>
      </svg>
    </button>
  </header>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="spade" viewBox="0 0 100 100">
      <path d="M50 4C50 4 8 38 8 60c0 15 12 24 25 21 4-1 8-3 11-6-1 9-5 17-13 21h38c-8-4-12-12-13-21 3 3 7 5 11 6 13 3 25-6 25-21C92 38 50 4 50 4z"/>
    </symbol>
  </svg>

  <div id="overlay" role="dialog" aria-modal="true" aria-label="Туз пик" aria-hidden="true">
    <div class="stage">
      <div class="flipper">
        <div class="face front">
          <svg viewBox="0 0 250 350">
            <rect width="250" height="350" fill="#fff"/>
            <rect x="3" y="3" width="244" height="344" rx="12" fill="none" stroke="#e2dfd5" stroke-width="2"/>
            <text x="20" y="52" font-family="Georgia,serif" font-weight="700" font-size="44" fill="#111">A</text>
            <use href="#spade" x="19" y="62" width="34" height="34" fill="#111"/>
            <use href="#spade" x="55" y="100" width="140" height="140" fill="#111"/>
            <g transform="rotate(180 125 175)">
              <text x="20" y="52" font-family="Georgia,serif" font-weight="700" font-size="44" fill="#111">A</text>
              <use href="#spade" x="19" y="62" width="34" height="34" fill="#111"/>
            </g>
          </svg>
        </div>
        <div class="face back">
          <svg viewBox="0 0 250 350">
            <defs>
              <pattern id="bk" width="16" height="16" patternUnits="userSpaceOnUse">
                <path d="M0 8L8 0L16 8L8 16Z" fill="none" stroke="#fff" stroke-opacity=".35"/>
              </pattern>
            </defs>
            <rect width="250" height="350" fill="#1f6f5c"/>
            <rect x="14" y="14" width="222" height="322" rx="8" fill="url(#bk)" stroke="#fff" stroke-opacity=".6"/>
          </svg>
        </div>
      </div>
      <div id="eggtext" role="status" aria-live="polite"></div>
      <button id="eggclose" type="button">Закрыть</button>
    </div>
  </div>

  <form id="form">
    <label for="url">Ссылка</label>
    <input id="url" type="url" required placeholder="https://..." autocomplete="off">
    <div class="row">
      <div>
        <label for="count">Слов в колоде</label>
        <input id="count" type="number" min="5" max="30" value="15">
      </div>
      <div>
        <label for="key">Код доступа</label>
        <input id="key" type="password" required autocomplete="current-password">
      </div>
    </div>
    <button id="go" type="submit">Создать колоду</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <section id="result" class="result hidden">
    <h2 id="title"></h2>
    <div class="downloads" id="downloads"></div>
    <table>
      <thead><tr><th>Слово</th><th>Значение</th><th>Перевод</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const keyStore = {
  get() { try { return localStorage.getItem("deckKey") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("deckKey", v); } catch {} },
};
$("key").value = keyStore.get();
if (location.protocol === "file:") {
  setStatus("Страница открыта как файл. Запусти сервер и открой http://localhost:8000", true);
}

function download(name, data, type) {
  const a = document.createElement("a");
  a.className = "dl";
  a.textContent = name;
  a.download = name;
  a.href = URL.createObjectURL(new Blob([data], { type }));
  return a;
}
function b64ToBytes(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function setStatus(text, isErr = false) {
  $("status").textContent = text;
  $("status").className = isErr ? "err" : "";
}

// Пасхалка: клик по тузу или набор "ace"
const EGGS = [
  "ace (verb) — сдать на отлично: «She aced the exam.»",
  "ace (noun) — мастер своего дела: «He's an ace at grammar.»",
  "ace up your sleeve — козырь в рукаве. Хорошая идиома для B2!",
  "play your cards right — разыграть всё умно. Удачной колоды!",
];
let eggIdx = 0;
function closeAce() {
  const o = $("overlay");
  if (!o.classList.contains("open")) return;
  o.classList.remove("open");
  o.setAttribute("aria-hidden", "true");
  $("ace").focus();
}
function ace() {
  const o = $("overlay");
  $("eggtext").textContent = EGGS[eggIdx++ % EGGS.length];
  o.classList.add("open");
  o.setAttribute("aria-hidden", "false");
  $("eggclose").focus({ preventScroll: true });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("div");
      s.className = "suit";
      s.textContent = "♠♥♦♣"[i % 4];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDelay = Math.random() * 0.5 + "s";
      s.style.color = i % 4 === 1 || i % 4 === 2 ? "#d33" : "inherit";
      document.body.append(s);
      setTimeout(() => s.remove(), 3000);
    }
  }
}
$("ace").addEventListener("click", ace);
$("eggclose").addEventListener("click", closeAce);
$("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay" || e.target.closest(".flipper")) closeAce(); });
let typed = "";
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return closeAce();
  if (e.target.matches("input, textarea")) return;
  typed = (typed + e.key.toLowerCase()).slice(-3);
  if (typed === "ace") ace();
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  $("result").classList.add("hidden");
  setStatus("Читаю материал и подбираю слова… это займёт до минуты.");
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": $("key").value },
      body: JSON.stringify({ url: $("url").value, count: Number($("count").value) }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Ошибка запроса (" + res.status + ")");
    keyStore.set($("key").value);

    $("title").textContent = data.title + " · " + data.count + " карточек";
    const box = $("downloads");
    box.replaceChildren();
    const apkg = download("deck.apkg", b64ToBytes(data.apkg_base64), "application/octet-stream");
    apkg.classList.add("primary");
    box.append(
      apkg,
      download("anki.txt", data.anki_csv, "text/plain;charset=utf-8"),
      download("quizlet.txt", data.quizlet_txt, "text/plain;charset=utf-8"),
      download("cards.csv", data.full_csv, "text/csv;charset=utf-8"),
    );
    const tbody = $("rows");
    tbody.replaceChildren();
    for (const c of data.cards) {
      const tr = document.createElement("tr");
      for (const [text, cls] of [[c.word, "w"], [c.definition_en, ""], [c.translation_ru, ""]]) {
        const td = document.createElement("td");
        td.textContent = text;
        if (cls) td.className = cls;
        tr.append(td);
      }
      tbody.append(tr);
    }
    $("result").classList.remove("hidden");
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
