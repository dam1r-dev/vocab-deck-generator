services:
  # Веб-сервис: API для Make.com + страница с формой
  - type: web
    name: vocab-deck-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: SERVICE_API_KEY
        generateValue: true
